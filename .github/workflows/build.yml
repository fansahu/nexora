name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Info
        run: |
          pwd
          ls -la
          flutter --version
          ls lib
          ls tools
          head -20 pubspec.yaml

      - name: Scaffold android
        run: |
          flutter create --platforms=android --org com.nexora --project-name nexora /tmp/base
          cp -r /tmp/base/android .
          ls android/app

      - name: Patch
        run: python3 tools/patch.py

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Build
        run: flutter build apk --release --split-per-abi --dart-define=TMDB_KEY=${{ secrets.TMDB_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
